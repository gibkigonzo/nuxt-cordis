# Jeden, pojedynczy pod Redis - jedyny stan, ktory MUSI byc spojny miedzy
# wieloma replikami 'shop' (koszyk, feature-toggle), patrz services/redis-service
# i ARCHITECTURE.md. SWIADOMY kompromis: brak persistent volume (dane w Redis
# gina przy restarcie TEGO poda - rolling update, OOM, przeniesienie na inny
# wezel) i brak replikacji/Sentinela (ten pod to teraz pojedynczy punkt awarii
# calego systemu). Prawdziwa odpornosc (PVC + Sentinel/Cluster) to osobny,
# wiekszy projekt, celowo NIE podjety bez wyraznej prosby - patrz uzasadnienie
# w ARCHITECTURE.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shop
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    # Redis NIE jest bezstanowo-wymienny jak 'shop' - RollingUpdate z
    # maxSurge:0 gwarantuje, ze nigdy nie dziala jednoczesnie wiecej niz
    # jeden pod Redis (uniknac dwoch niezaleznych, rozjezdzajacych sie
    # zrodel prawdy), kosztem krotkiego okna niedostepnosci podczas
    # aktualizacji tego poda.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shop
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  type: ClusterIP
