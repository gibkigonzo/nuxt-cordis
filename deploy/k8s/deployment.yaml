# Normalny deployment kubernetesowy calego "modularnego monolitu runtime"
# (jeden obraz = jeden proces Node = home + product + cart + brama, patrz
# deploy/docker/Dockerfile). Aktualizacja KTOREGOKOLWIEK modulu (w tym
# pojedynczej aplikacji Nuxt) = nowy obraz (nowy tag, zwykle git sha) +
# standardowy rolling update ponizej - zero pobierania/rozpakowywania kodu
# przez siec w dzialajacym procesie (patrz deploy/README.md#kubernetes po
# pelne wyjasnienie i uzasadnienie tej decyzji).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: shop
  labels:
    app: shop
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 -> podczas aktualizacji zawsze dostepna jest pelna
      # liczba replik (zero przestoju), kosztem chwilowego +1 poda ponad
      # `replicas` (maxSurge: 1).
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      # Obraz jest budowany i publikowany WYLACZNIE przez CI (patrz
      # deploy/workflows/build-and-push.yml) - nadpisywane tagiem = git sha
      # przy kazdym deploymencie (`kustomize edit set image`), nigdy nie
      # `latest` w prawdziwym rolling update (potrzebny do bezpiecznego
      # rollbacku przez `kubectl rollout undo`).
      containers:
        - name: shop
          image: ghcr.io/gibkigonzo/nuxt-cordis-shop:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
          # apps/shop (modul home) odpowiada na `/` ruchem strony glownej -
          # ten sam endpoint uzywa juz deploy/docker/docker-compose.yml jako
          # healthcheck. WYMAGA host: 0.0.0.0 w cordis.yml (patrz komentarz
          # tam) - inaczej proces nie przyjmie polaczenia z kubelet.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # SIGTERM wysylany przez k8s przy rolling update/scale-down jest
      # obslugiwany przez orchestrator/src/index.ts (kaskadowe
      # ctx.fiber.dispose(), zweryfikowane ~160ms przy `docker stop`) - 30s to
      # bezpieczny margines, nie realistyczny czas zamkniecia.
      terminationGracePeriodSeconds: 30
