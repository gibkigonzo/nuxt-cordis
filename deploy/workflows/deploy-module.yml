# Docelowo: .github/workflows/deploy-module.yml (patrz deploy/README.md po
# instrukcje przeniesienia). Trzymany w deploy/workflows/ zamiast .github/workflows/
# jako REFERENCYJNY szablon do przejrzenia/dostosowania przed pierwszym uzyciem
# (wymaga sekretow Cloudflare, patrz nizej), a nie od razu aktywny pipeline.
#
# Realizuje dokladnie flow z deploy.md:
#   1. Wykrywa, KTORE moduly (apps/<id>) zmienily sie w tym pushu.
#   2. Buduje TYLKO te moduly (Nitro preset "node-listener").
#   3. Pakuje kazdy zbudowany ".output" w archiwum .tar.gz i wrzuca je na
#      Cloudflare R2 (obiektowy storage - "moduly sa ladowane przez URL").
#   4. Aktualizuje rekord manifestu w Cloudflare KV - "source of truth", ktory
#      dzialajacy orchestrator (poza CI, patrz @shop/remote-sync) odpytuje
#      okresowo i sam decyduje kiedy/jak przeladowac wlasciwy fiber - bez
#      restartu calego procesu, bez ingerencji tego pipeline'u w runtime.
#
# CI NIE loguje sie do dzialajacego orchestratora i niczego mu nie "wysyla" -
# to orchestrator (zdalny reconciler @shop/remote-sync) sam wykrywa zmiane
# manifestu w KV. Ten pipeline jest wylacznie "producentem" artefaktow.

name: Deploy changed module

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'cordis.yml'

permissions:
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # Kazdy klucz = jeden potencjalny modul. Dodanie piatej aplikacji
          # (apps/checkout, apps/loyalty, ...) to jedna dodatkowa linia tutaj.
          filters: |
            home: 'apps/home/**'
            product: 'apps/product/**'
            cart: 'apps/cart/**'
            checkout: 'apps/checkout/**'

  build-and-publish:
    needs: detect-changes
    if: needs.detect-changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.detect-changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Instalacja calego workspace (pnpm potrzebuje pelnego grafu zaleznosci
      # do poprawnego rozwiazania linkow workspace:*), ale BUDOWANY jest
      # wylacznie modul z tego pola macierzy (matrix.app) - to jest "buduje
      # tylko nowy modul" z deploy.md.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.app }} run build

      - name: Zbuduj artefakt (.tar.gz z .output)
        id: pack
        run: |
          VERSION="${{ github.sha }}"
          node deploy/scripts/publish-module.mjs "${{ matrix.app }}" "$RUNNER_TEMP/artifacts"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$(ls "$RUNNER_TEMP"/artifacts/*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"
        env:
          MODULE_VERSION: ${{ github.sha }}

      # Wymaga sekretow: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID oraz
      # zmiennych: R2_BUCKET (nazwa bucketu R2), KV_NAMESPACE_ID (id namespace
      # KV przechowujacego manifest). Patrz deploy/README.md po konfiguracje.
      - name: Publikuj artefakt na Cloudflare R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            r2 object put
            ${{ vars.R2_BUCKET }}/modules/${{ matrix.app }}-${{ steps.pack.outputs.version }}.tar.gz
            --file=${{ steps.pack.outputs.file }}
            --remote

      # Manifest w KV pod jednym stalym kluczem "manifest" - JSON zgodny z
      # RemoteManifest z packages/remote-sync. Ten krok go CZYTA, dopisuje/
      # aktualizuje wpis dla matrix.app i zapisuje z powrotem. (W realnym
      # repo warto to zrobic atomowo przez maly Worker zamiast read-modify-write
      # z CI - tutaj zoptymalizowane pod czytelnosc przykladu.)
      - name: Zaktualizuj manifest w Cloudflare KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            kv key put --namespace-id=${{ vars.KV_NAMESPACE_ID }}
            "entry:${{ matrix.app }}"
            '{"id":"${{ matrix.app }}","version":"${{ steps.pack.outputs.version }}","artifactUrl":"${{ vars.R2_PUBLIC_BASE_URL }}/modules/${{ matrix.app }}-${{ steps.pack.outputs.version }}.tar.gz","config":${{ toJSON(vars[format('MODULE_CONFIG_{0}', matrix.app)]) }}}'
            --remote

  # Maly Worker (deploy/cloudflare/manifest-worker) czyta wszystkie klucze
  # "entry:*" z KV i skleja je w jeden { entries: [...] } pod /manifest.json -
  # dokladnie ten URL, ktory @shop/remote-sync odpytuje. Patrz deploy/cloudflare/.
