# Pojedynczy kontener/serwis - to jest sedno "modularnego monolitu runtime":
# trzy (lub wiecej) aplikacje Nuxt + uslugi + brama dzialaja w JEDNYM procesie
# Node, nie w osobnych kontenerach. Skalowanie poziome = wiecej replik CALEGO
# procesu za zewnetrznym load balancerem (nie: wiecej kontenerow per aplikacja).
services:
  shop:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: nuxt-cordis-shop:latest
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      CORDIS_CONFIG: ./cordis.yml
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:8080/").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
