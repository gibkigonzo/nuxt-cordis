# Wersja z lokalnym watcherem rekompilacji (config.watch: true) - patrz
# @shop/nuxt-wrapper. Uzycie: CORDIS_CONFIG=./cordis.dev.yml pnpm run start
# (lub `pnpm run dev`, ktory ustawia to domyslnie).
# Deklaratywna konfiguracja calego sklepu (Definition 74 w pracy o Cordis: kazdy
# wpis = jeden fiber). Kolejnosc wpisow NIE ma znaczenia funkcjonalnego - Loader
# tworzy je wspolbieznie (Promise.all), a rzeczywista kolejnosc aktywacji wynika
# WYLACZNIE z tego, kto co deklaruje przez `inject` (Theorem 63/73: koniowy stan
# jest funkcja configu, nie harmonogramu). Ponizsza kolejnosc jest czysto
# kosmetyczna (uslugi -> jedna appka Nuxt).

# --- konsola/logi -----------------------------------------------------------
- id: logger
  name: '@cordisjs/plugin-logger-console'

# --- HMR wlasnego kodu warstwy Cordis (packages/*, services/*) ---------------
# UWAGA: to obserwuje ZRODLA komponentow (nuxt-wrapper w packages/, cart-service
# w services/, ...), NIE zbudowana appke Nuxt - ta ma WLASNY watcher wbudowany
# w @shop/nuxt-wrapper (config.watch), bo jest ladowana przez dynamiczny
# import() z URL-em obliczanym w runtime, ktorego @cordisjs/plugin-hmr nie widzi
# w statycznym grafie modulow.
- id: hmr
  name: '@cordisjs/plugin-hmr'
  config:
    root: ['packages', 'services', 'orchestrator/src']
    debounce: 300
    ignored: ['**/node_modules/**', '**/.output/**', '**/dist/**']

# --- koefekty (wspoldzielone uslugi w pamieci procesu) -----------------------
- id: product-service
  name: '@shop/product-service'

- id: cart-service
  name: '@shop/cart-service'

- id: feature-registry-service
  name: '@shop/feature-registry-service'

# --- jedyna aplikacja Nuxt (apps/shop, sklada modules/*) ---------------------
# `host: 0.0.0.0` - patrz uzasadnienie w cordis.yml (broker usuniety, shop
# jest teraz jedynym publicznie eksponowanym portem).
- id: shop
  name: '@shop/nuxt-wrapper'
  config:
    id: shop
    dir: ./apps/shop
    host: 0.0.0.0
    port: 8080
    inject: ['cart', 'product', 'features']
    watch: true
