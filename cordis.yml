# Deklaratywna konfiguracja calego sklepu (Definition 74 w pracy o Cordis: kazdy
# wpis = jeden fiber). Kolejnosc wpisow NIE ma znaczenia funkcjonalnego - Loader
# tworzy je wspolbieznie (Promise.all), a rzeczywista kolejnosc aktywacji wynika
# WYLACZNIE z tego, kto co deklaruje przez `inject` (Theorem 63/73: koniowy stan
# jest funkcja configu, nie harmonogramu). Ponizsza kolejnosc jest czysto
# kosmetyczna (uslugi -> jedna appka Nuxt).
#
# UWAGA (patrz ARCHITECTURE.md#10): od tej wersji istnieje JEDNA aplikacja Nuxt
# (apps/shop), skladajaca strony/route'y z modules/home, modules/product,
# modules/cart (Nuxt Modules, build-time) - nie trzy osobne fibery/porty jak
# wczesniej. Broker (`@shop/broker`) i reaktywna tabela tras (`@shop/router-service`)
# zostaly USUNIETE, bo Nuxt sam routuje wewnatrz jednej appki - nie ma juz czego
# proxowac. Koefekty backendowe (`cart`, `product`) oraz nowy `features`
# (rejestr wlaczonych/wylaczonych modulow, patrz services/feature-registry-service)
# pozostaja niezaleznymi komponentami Cordis.

# --- konsola/logi -----------------------------------------------------------
- id: logger
  name: '@cordisjs/plugin-logger-console'

# --- HMR wlasnego kodu warstwy Cordis (packages/*, services/*) ---------------
# UWAGA: to obserwuje ZRODLA komponentow (nuxt-wrapper w packages/, cart-service
# w services/, ...), NIE zbudowana appke Nuxt - ta ma WLASNY watcher wbudowany
# w @shop/nuxt-wrapper (config.watch), bo jest ladowana przez dynamiczny
# import() z URL-em obliczanym w runtime, ktorego @cordisjs/plugin-hmr nie widzi
# w statycznym grafie modulow.
- id: hmr
  name: '@cordisjs/plugin-hmr'
  config:
    root: ['packages', 'services', 'orchestrator/src']
    debounce: 300
    ignored: ['**/node_modules/**', '**/.output/**', '**/dist/**']

# --- Redis: jedyny stan, ktory MUSI byc spojny miedzy wieloma podami tego
# samego obrazu (koszyk, wlaczone/wylaczone moduly) - patrz uzasadnienie w
# services/redis-service. `cart-service`/`feature-registry-service` deklaruja
# `static inject = ['redis']`, wiec KONSTRUUJA sie dopiero gdy koefekt
# 'redis' istnieje - ale to istnieje NATYCHMIAST po skonstruowaniu
# RedisService, NIE dopiero po udanym polaczeniu (`ctx.effect()` w jej
# konstruktorze jest asynchroniczny i nie blokuje dostarczenia koefektu) -
# zweryfikowane empirycznie, patrz docstring RedisService i
# ARCHITECTURE.md#shared-state. Kolejnosc ponizej jest czysto kosmetyczna.
#
# UWAGA: celowo BEZ `config.url` tutaj - `cordis.yml` jest zapieczone w obrazie
# (ARCHITECTURE.md#8), wiec adres Redisa NIE moze byc w nim zahardkodowany
# (rozny per srodowisko: localhost lokalnie, `redis://redis:6379` w k8s przez
# DNS namespace'u). RedisService czyta `process.env.REDIS_URL`, z lokalnym
# `redis://127.0.0.1:6379` jako domyslnym fallbackiem - patrz deploy/k8s/deployment.yaml.
- id: redis-service
  name: '@shop/redis-service'

# --- koefekty (wspoldzielone uslugi) -----------------------------------------
- id: product-service
  name: '@shop/product-service'

- id: cart-service
  name: '@shop/cart-service'

- id: feature-registry-service
  name: '@shop/feature-registry-service'

# --- jedyna aplikacja Nuxt (apps/shop, sklada modules/*) ---------------------
# UWAGA: `host: 0.0.0.0` jest tu WYMAGANE (@shop/nuxt-wrapper domyslnie binduje
# do 127.0.0.1 - poprawne dla instancji ukrytych za brokerem, ale `shop` jest
# TERAZ jedynym publicznie eksponowanym portem calego systemu, odkad broker
# zostal usuniety - patrz ARCHITECTURE.md#11). Bez tego kontener/pod
# odrzucalby kazde polaczenie z zewnatrz (Docker/k8s lacza sie przez
# interfejs sieciowy kontenera, nie przez loopback) - zaobserwowane w code
# review tej sesji, nigdy nie wykryte lokalnie, bo `curl localhost:8080`
# z tej samej maszyny dziala niezaleznie od tego, na jakim interfejsie
# proces faktycznie nasluchuje.
- id: shop
  name: '@shop/nuxt-wrapper'
  config:
    id: shop
    dir: ./apps/shop
    host: 0.0.0.0
    port: 8080
    inject: ['cart', 'product', 'features']

# Czwarty modul (modules/checkout) jest celowo NIE dopisany do apps/shop/nuxt.config.ts
# jeszcze - patrz deploy/checkout-module-plan.md. Jego dodanie polega WYLACZNIE
# na dopisaniu go do listy `modules` w apps/shop/nuxt.config.ts (build-time) -
# bez zadnego wpisu tutaj i bez restartu tego wpisu (ten sam fiber `shop`
# po prostu dostaje nowy build).
